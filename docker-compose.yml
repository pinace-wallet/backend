version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pinace_indexer
      POSTGRES_USER: pinace
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      SUI_RPC_URL: https://fullnode.testnet.sui.io:443
      PACKAGE_ID: 0x5be5ab0292590e61e2dc21d11cc7174970f48e5ff54c88d4797c81b2a751a23b
      DATABASE_URL: postgresql://pinace:secret@postgres:5432/pinace_indexer
      POLL_INTERVAL_MS: 2000
      BATCH_SIZE: 50
      PORT: 3001
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      - postgres

volumes:
  pgdata:
